name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build the npm package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        env:
          TAG_VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          set -o pipefail
          TARBALL=$(npm pack | tail -n 1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to >=11.5.1
        run: npm install -g npm@latest

      - name: Verify the package matches the tag
        env:
          TAG_VERSION: ${{ needs.release-please.outputs.tag_name }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(tar -xOzf "$TARBALL" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>console.log(JSON.parse(s).version))')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match the packed version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm with provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          TAG_VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          PKG_NAME=$(tar -xOzf "$TARBALL" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>console.log(JSON.parse(s).name))')
          if npm view "$PKG_NAME@${TAG_VERSION#v}" version > /dev/null 2>&1; then
            PUBLISHED=$(npm view "$PKG_NAME@${TAG_VERSION#v}" dist.integrity)
            BUILT="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w 0)"
            if [ "$PUBLISHED" != "$BUILT" ]; then
              echo "::error::$PKG_NAME@${TAG_VERSION#v} is already on npm with integrity $PUBLISHED, not the $BUILT this run built"
              exit 1
            fi
            echo "$PKG_NAME@${TAG_VERSION#v} is already on npm with this run's tarball; nothing to publish."
            exit 0
          fi
          npm publish "./$TARBALL" --provenance --access public --ignore-scripts

  registry:
    name: Publish to the MCP Registry
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      REGISTRY_URL: https://registry.modelcontextprotocol.io
    steps:
      - name: Fetch server.json at the release tag and stamp its version
        env:
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --output server.template.json \
            "https://raw.githubusercontent.com/${REPOSITORY}/${TAG_NAME}/server.json"
          VERSION="${TAG_NAME#v}"
          if [ "$(jq 'has("version") or (.packages[0] | has("version"))' server.template.json)" != "false" ]; then
            echo "::error::server.json at $TAG_NAME names a version; the release job writes it from the tag"
            exit 1
          fi
          jq --arg version "$VERSION" '.version = $version | .packages[0].version = $version' server.template.json > server.json
          {
            echo "VERSION=$VERSION"
            echo "SERVER_NAME=$(jq -r '.name' server.json)"
            echo "PACKAGE_NAME=$(jq -r '.packages[0].identifier' server.json)"
          } >> "$GITHUB_ENV"

      - name: Wait until npm serves mcpName for this version
        run: |
          set -euo pipefail
          url="https://registry.npmjs.org/${PACKAGE_NAME/\//%2F}/${VERSION}"
          deadline=$((SECONDS + 600))
          until [ "$(curl --fail --silent --location --max-time 30 "$url" | jq -r '.mcpName // empty')" = "$SERVER_NAME" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::npm does not serve mcpName $SERVER_NAME for $PACKAGE_NAME@$VERSION after 10 minutes"
              exit 1
            fi
            sleep 15
          done
          echo "npm serves $PACKAGE_NAME@$VERSION with mcpName $SERVER_NAME"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish server.json
        run: |
          set -euo pipefail
          version_url="${REGISTRY_URL}/v0.1/servers/${SERVER_NAME/\//%2F}/versions/${VERSION}"
          if [ "$(curl --silent --max-time 30 --output /dev/null --write-out '%{http_code}' "$version_url")" = "200" ]; then
            echo "$SERVER_NAME $VERSION is already listed; nothing to publish."
            exit 0
          fi
          for attempt in 1 2 3; do
            ./mcp-publisher login github-oidc
            if ./mcp-publisher publish server.json > publish.log 2>&1; then
              cat publish.log
              exit 0
            fi
            cat publish.log
            if grep -qi 'already exists' publish.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && grep -qi 'not found' publish.log; then
              sleep 30
              continue
            fi
            exit 1
          done
          exit 1

      - name: Read the listing back
        run: |
          set -euo pipefail
          latest=$(curl --fail --silent --show-error --retry 3 --max-time 30 "${REGISTRY_URL}/v0.1/servers/${SERVER_NAME/\//%2F}/versions/latest")
          listed_version=$(printf '%s' "$latest" | jq -r '.server.version')
          listed_package=$(printf '%s' "$latest" | jq -r '.server.packages[0].identifier')
          listed_status=$(printf '%s' "$latest" | jq -r '._meta["io.modelcontextprotocol.registry/official"].status')
          if [ "$listed_version" != "$VERSION" ] || [ "$listed_package" != "$PACKAGE_NAME" ] || [ "$listed_status" != "active" ]; then
            echo "::error::the Registry's latest $SERVER_NAME is $listed_version of $listed_package ($listed_status), expected $VERSION of $PACKAGE_NAME (active)"
            exit 1
          fi
          differing=$(printf '%s' "$latest" | jq -c --slurpfile local server.json \
            '($local[0] | del(."$schema")) as $l | (.server | del(."$schema")) as $r | [([$l | paths(type | . != "object" and . != "array")] + [$r | paths(type | . != "object" and . != "array")] | unique)[] as $p | select(($r | getpath($p)) != ($l | getpath($p))) | $p | map(tostring) | join(".")]')
          if [ "$differing" != "[]" ]; then
            echo "::error::the Registry's listing of $SERVER_NAME $VERSION differs from server.json at the tag in $differing"
            exit 1
          fi
          echo "$SERVER_NAME $VERSION is the latest active listing, package $PACKAGE_NAME, and matches server.json"

  release-alert:
    name: Alert on a failed release
    needs: [release-please, build, publish, registry]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post to the ops channel
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CREATED" = "true" ]; then
            text="Release $TAG_NAME of $REPOSITORY failed: $RUN_URL"
          else
            text="Release Please failed on $REPOSITORY before reporting a release; check for a tag without its package: $RUN_URL"
          fi
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DISCORD_OPS_WEBHOOK_URL is not set; $text"
            exit 1
          fi
          payload=$(jq -n --arg text "$text" '{content: $text, allowed_mentions: {parse: []}}')
          curl --fail --silent --show-error --max-time 20 --output /dev/null --write-out 'Discord answered %{http_code}\n' \
            -H 'Content-Type: application/json' -H 'User-Agent: AetherOps/1.0' \
            --data "$payload" "${WEBHOOK_URL}?wait=true"
